[package]
name = "mereth-reader"
version = "0.1.0"
description = "Mereth Reader — a calm, local-first PDF reader"
authors = ["Reader contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mereth_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

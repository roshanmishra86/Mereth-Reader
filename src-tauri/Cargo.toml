[package]
name = "mereth-reader"
version = "0.1.0"
description = "Mereth Reader — a calm, local-first PDF reader"
authors = ["Reader contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mereth_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["bundled-full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.11", features = ["v4"] }
tempfile = "3.14"
url = "2.5"

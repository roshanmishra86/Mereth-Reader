name: Release Windows installer

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-nsis:
    name: Build and publish Windows NSIS installer
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Verify tag matches the application version
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $expectedTag = "v$($config.version)"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            Write-Error "Tag ${{ github.ref_name }} does not match Tauri version $($config.version). Expected $expectedTag."
            exit 1
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer and create GitHub Release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Mereth Reader v__VERSION__
          releaseBody: |
            Download the Windows NSIS setup executable below to install Mereth Reader.

            This personal-use build is currently unsigned, so Windows may display a SmartScreen warning.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          tauriScript: pnpm tauri
          args: --bundles nsis
          releaseAssetNamePattern: Mereth-Reader_[version]_[arch]-setup.[ext]
